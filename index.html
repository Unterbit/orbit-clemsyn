.app{background:radial-gradient(ellipse at 50% -10%,#33247880,transparent 46%),radial-gradient(ellipse at 0% 55%,#1b3c7550,transparent 40%),#001242}.health-topbar{background:linear-gradient(90deg,#09123e,#16114c 48%,#071946);box-shadow:0 6px 24px #000c2a50}.health-brand span{background:linear-gradient(135deg,#ffc365,#f63b9a);color:#fff;box-shadow:0 3px 0 #972e85;border-radius:11px}.orbit-home .orbit-intro{background:radial-gradient(ellipse at 80% 6%,#cd36a166 0,transparent 34%),radial-gradient(ellipse at 62% 85%,#056c9e55,transparent 36%),linear-gradient(125deg,#193a88,#101c5a 58%,#251453);border-color:#789aff80;box-shadow:inset 0 1px 0 #c5eaff55,0 5px 0 #0a1548,0 25px 48px #02092980}.orbit-home .orbit-intro:after{content:'';position:absolute;right:4%;top:17%;width:30%;height:60%;border:1px solid #a0baff35;border-radius:50%;transform:rotate(-15deg);pointer-events:none}.next-eyebrow .earth-mascot{width:112px;height:112px;filter:drop-shadow(0 11px 12px #00052c99)}.orbit-next h1{font-size:clamp(38px,3.4vw,49px)}.orbit-flight:before{content:'';position:absolute;width:78%;height:60%;left:12%;top:13%;border:1px dashed #a9c8ff66;border-radius:50%;transform:rotate(-20deg);pointer-events:none}.orbit-stars{background-image:radial-gradient(circle at 14% 13%,#a6e4ff 0 2px,transparent 3px),radial-gradient(circle at 31% 36%,#fbb2ff 0 2px,transparent 3px),radial-gradient(circle at 61% 12%,#c2ceff 0 2px,transparent 3px),radial-gradient(circle at 85% 80%,#ffdc9d 0 2px,transparent 3px)}
.module-intro{isolation:isolate;background:radial-gradient(ellipse at 74% 20%,#4ebcff66,transparent 43%),radial-gradient(ellipse at 95% 95%,#a23bba55,transparent 40%),linear-gradient(125deg,#153d82,#16205b 72%);border-color:#7196d77a;box-shadow:inset 0 1px 0 #ffffff45,0 6px 0 #0b1744,0 18px 28px #00082055}.module-page-fuel .module-intro{background:radial-gradient(ellipse at 75% 20%,#ffd87564,transparent 42%),linear-gradient(120deg,#6c365e,#32245e 72%)}.module-page-recover .module-intro{background:radial-gradient(ellipse at 75% 20%,#e9baff70,transparent 42%),linear-gradient(120deg,#50357d,#1c295d 72%)}.module-page-mind .module-intro{background:radial-gradient(ellipse at 75% 20%,#fa91d665,transparent 42%),linear-gradient(120deg,#5e306b,#20275c 72%)}.module-page-medbay .module-intro{background:radial-gradient(ellipse at 75% 20%,#5af4e777,transparent 42%),linear-gradient(120deg,#15566c,#182e5e 72%)}.module-intro:after{content:'';position:absolute;z-index:-1;right:4%;top:13%;width:31%;height:70%;border-radius:50%;border:1px solid #d4eeff52;transform:rotate(-15deg)}.module-action{background:linear-gradient(105deg,#193b78,#112658);border-color:#4d6da9;box-shadow:inset 0 1px 0 #b2ddff22,0 3px 0 #091a45}.module-action:hover{background:linear-gradient(105deg,#2754a1,#1b3472);border-color:#91c4ff}.module-action-arrow{display:grid;place-items:center;border-radius:12px;width:38px;height:38px;background:#4277ce66;color:white}.destination .orbit-object-art{filter:drop-shadow(0 10px 8px #000a3c99);transition:transform .28s cubic-bezier(.2,.8,.2,1)}.destination:hover .orbit-object-art{transform:translateY(-5px) rotate(-3deg)}.snapshot-tile:active,.destination:active,.module-action:active{transform:translateY(2px)}
@keyframes celebration-enter{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes mascot-celebrate{0%{transform:translateY(12px) scale(.85) rotate(-12deg);background-image:var(--earth-proud)}30%{transform:translateY(-12px) scale(1.08) rotate(8deg);background-image:var(--earth-celebrate)}65%{transform:translateY(0) scale(.98) rotate(-5deg);background-image:var(--earth-celebrate)}100%{transform:translateY(-3px) scale(1) rotate(0);background-image:var(--earth-proud)}}@keyframes star-pop{0%{opacity:0;transform:translateY(8px) scale(.3)}35%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{opacity:0;transform:translateY(-28px) scale(.6)}}@keyframes proud-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}@keyframes listen-bob{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@media(max-width:700px){.next-eyebrow .earth-mascot{width:90px;height:90px}.feedback-celebrate{min-height:110px}.feedback-art{width:76px;height:80px}.feedback-art .earth-mascot{width:88px;height:88px}.feedback-copy strong{font-size:18px}.modal-companion .earth-mascot{width:44px;height:44px}.gallery-welcome .earth-mascot{width:68px;height:68px}.module-intro:after{width:35%}.orbit-home .orbit-intro:after{display:none}}
@media(prefers-reduced-motion:reduce){.feedback-celebrate,.feedback-art .earth-mascot,.celebration-star,.modal-companion .earth-mascot,.gallery-welcome .earth-mascot{animation:none!important}.feedback-celebrate{opacity:1;transform:none}.celebration-star{opacity:0}.destination:hover .orbit-object-art,.snapshot-tile:active,.destination:active,.module-action:active{transform:none!important}.plan-progress-track span,.destination .orbit-object-art{transition:none!important}}
.ui-reduce-motion *,.ui-reduce-motion *::before,.ui-reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.ui-reduce-motion .feedback-celebrate{opacity:1;transform:none}.ui-reduce-motion .celebration-star{opacity:0}.ui-reduce-motion .destination:hover .orbit-object-art,.ui-reduce-motion .snapshot-tile:hover,.ui-reduce-motion .destination:hover,.ui-reduce-motion .module-action:hover{transform:none!important}
/* Ambient starfield and compact, layered home composition. */
.app,.app:has(.orbit-home){position:relative;isolation:isolate;background:radial-gradient(ellipse at 11% 8%,#25165c 0,transparent 40%),radial-gradient(ellipse at 92% 18%,#092b63 0,transparent 36%),linear-gradient(155deg,#070f37 0%,#00133d 50%,#110d3a 100%)}
.app::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:url('assets/image-9f79eea04d4b.svg');background-position:center top;background-size:1100px 752px;background-repeat:repeat;opacity:.66}
.orbit-home .orbit-intro{min-height:250px;padding:20px 26px}.orbit-intro.no-flight{grid-template-columns:1fr;min-height:0}.orbit-intro.no-flight .orbit-next{max-width:700px}.orbit-content{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,.9fr);gap:32px;align-items:start;margin-top:30px}.orbit-support{min-width:0;display:grid;gap:18px}.orbit-support .snapshot{margin:0}.orbit-support .snapshot-heading{align-items:start;margin-bottom:14px}.orbit-support .snapshot-heading h2{font-size:24px}.orbit-support .snapshot-heading p{max-width:26ch}.orbit-support .snapshot-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.orbit-support .snapshot-tile{min-height:142px;padding:15px;gap:6px}.orbit-support .snapshot-value{font-size:23px}.orbit-support .snapshot-symbol{width:32px;height:32px;font-size:18px}.orbit-support .snapshot-meta,.orbit-support .snapshot-quality{font-size:12px}.orbit-support .orbit-context-panel{padding:20px;margin:0}.orbit-support .orbit-context{margin-top:10px;padding-top:12px}.orbit-support .orbit-record{padding:5px 0}.orbit-home .health-agenda{min-width:0}.orbit-home .health-agenda-list h3{margin:20px 0 7px}.orbit-home .health-agenda-list .orbit-row{min-height:70px;padding:10px}.orbit-home .health-agenda-list .orbit-row.is-next{min-height:92px}.orbit-home .health-week{margin:16px 0 16px}
/* Let stars show through the upper part of navigational pedestals. */
.destination,.destination:has(.object-move){border-color:#a0c4ff30;background:radial-gradient(ellipse at 50% 44%,#5fc5ff38,transparent 54%),linear-gradient(180deg,#1e3b7d00 4%,#1d458ca8 47%,#203f91 100%);box-shadow:inset 0 -1px 0 #9edaff42,0 6px 0 #101b48,0 14px 26px #00072470}
.destination:has(.object-fuel){background:radial-gradient(ellipse at 50% 44%,#ffc2693d,transparent 54%),linear-gradient(180deg,#58335900 4%,#693866a8 47%,#743e72 100%)}
.destination:has(.object-recover){background:radial-gradient(ellipse at 50% 44%,#d8b3ff42,transparent 54%),linear-gradient(180deg,#44327000 4%,#514083a8 47%,#4d3e88 100%)}
.destination:has(.object-mind){background:radial-gradient(ellipse at 50% 44%,#ff88ca3b,transparent 54%),linear-gradient(180deg,#61326900 4%,#683b83a8 47%,#6b3d89 100%)}
.destination:has(.object-medbay){background:radial-gradient(ellipse at 50% 44%,#58e1e63d,transparent 54%),linear-gradient(180deg,#144d7000 4%,#20617da8 47%,#205b82 100%)}
.destination:before{content:'';position:absolute;inset:auto 12px 6px;height:42%;border-radius:16px;background:linear-gradient(145deg,#ffffff1c,transparent 40%);pointer-events:none}.destination-name,.destination-status,.destination-arrow{position:relative;z-index:1}.destination-arrow{position:absolute}.destination>.orbit-object-art{z-index:1}.destination:hover{border-color:#d5ebff80}
.snapshot-tile{box-shadow:inset 0 1px 0 #d8f6ff55,inset 0 -1px 0 #ffffff12,0 5px 0 #091a47,0 10px 24px #00072a66}.snapshot-tile:before{content:'';position:absolute;inset:1px 1px auto;height:45%;border-radius:19px 19px 60% 12px;background:linear-gradient(135deg,#ffffff1f,transparent 66%);pointer-events:none}.snapshot-tile>*{position:relative;z-index:1}
.module-intro{min-height:205px}.module-illustration{height:205px}.module-illustration .orbit-object-art{width:230px;height:195px}.module-plan,.module-available,.module-records,.module-coverage{margin-bottom:24px}.module-workspace{gap:28px;margin-top:22px}.gallery-heading{padding-bottom:0}.destination-grid{margin-top:28px}
/* Text-entry and health-data surfaces stay opaque over the starfield. */
.modal,.chat,.card,.module-records,.module-note,.orbit-context-panel,.anatomy-stage{background-color:#0d2052}.modal{background:#0d2052}.chat{background:#0d2052}
@media(max-width:1024px){.orbit-content{grid-template-columns:1fr;gap:24px}.orbit-support .snapshot-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:800px){.orbit-support .snapshot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.orbit-support .snapshot-tile{min-height:135px}}
@media(max-width:700px){.orbit-content{margin-top:22px;gap:20px}.orbit-home .orbit-content{order:2}.orbit-home .orbit-flight{order:3}.orbit-home .orbit-footer{order:4}.orbit-support .snapshot{margin:0}.orbit-home .orbit-intro{padding:0}.module-intro{min-height:160px}.module-illustration{height:150px}.module-illustration .orbit-object-art{width:140px;height:140px}.orbit-support .snapshot-tile{min-height:125px}.app::before{background-size:820px 561px;opacity:.5}}

/* Shared space-world surfaces across modules, records, activities and dialogs. */

function modulePage(id){const m=modules[id],ts=person().tasks.filter(t=>taskInfo(t).module===id&&t.day===state.day),rs=person().records.filter(r=>definitions[r.type]?.module===id).slice(-3).reverse(),labels={move:['Your movement plan','Session options','Recent sessions'],fuel:['Today in the galley','Meal & fluid check-ins','Recent meal and fluid records'],recover:['Your recovery plan','Rest and sleep','Recent rest records'],mind:['Your private check-in','Mood and attention','Recent private records'],medbay:['Your assigned observations','Record an observation','Recent private observations']},copy=labels[id],planned=ts.length?ts.map(t=>taskRow(t)).join(''):'<p class="subtle">No actions assigned today. You can still use an available check-in.</p>',renderAction=type=>`<button class="module-action" data-open="${type}"><span class="module-action-copy"><b>${definitions[type].title}</b><small>${['A01','A02','A03','A04'].includes(type)?'Record an external reading':type==='A08'?'Try the attention activity':'Open private check-in'}</small></span><span class="module-action-arrow" aria-hidden="true">→</span></button>`,groups=id==='fuel'?[['Meal journal',['meal']],['Measured fluids',['water']]]:id==='recover'?[['Sleep report',['A05']],['Recovery break',['rest']]]:id==='mind'?[['Private self-report',['A06']],['Experimental activity',['A08']]]:id==='medbay'?[['External readings',['A01','A02','A03','A04']],['Symptoms and function',['A07']]]:[['Session record',['move']]],actions=groups.map(([name,types])=>`<div class="module-action-group"><h3>${name}</h3>${types.map(renderAction).join('')}</div>`).join(''),records=rs.length?rs.map(recordRow).join(''):'<p class="subtle">No records yet. Saved check-ins appear here.</p>',map=id==='medbay'?`<section class="card module-coverage"><h2>Observation map</h2><p class="subtle">Select a region to see recorded coverage and open review notes. Missing data does not mean healthy.</p>${bodyMap()}${region?regionDetail():''}</section>`:'';return `<div class="module-page module-page-${id}"><div class="module-topline"><button class="module-back" data-view="apps">← All health modules</button><span>PRIVATE · ON THIS DEVICE</span></div><section class="module-intro"><div class="module-intro-copy"><div class="eyebrow">HEALTH / ${esc(m.label.toUpperCase())}</div><h1>${m.label}</h1><p>${esc(m.tagline)}</p>${ts.find(t=>!t.done&&!t.deferred&&!t.skipped)?`<button class="btn btn-primary" data-open="${ts.find(t=>!t.done&&!t.deferred&&!t.skipped).type}" data-task="${ts.find(t=>!t.done&&!t.deferred&&!t.skipped).id}">Open next action →</button>`:''}</div><div class="module-illustration">${moduleObject(id)}</div></section><div class="module-workspace"><div class="module-main"><section class="module-plan"><div class="module-section-heading"><div><span class="eyebrow">TODAY</span><h2>${copy[0]}</h2></div><button class="module-quiet-link" data-view="home">View plan →</button></div>${planned}</section>${id==='medbay'?map:''}${id==='move'?workoutPanel():''}${id==='recover'?recoveryPanel():''}<section class="module-available"><div class="module-section-heading"><div><h2>${copy[1]}</h2></div></div><p class="subtle">Choose a check-in to add a record.</p><div class="module-action-list">${actions}</div>${id==='mind'?'<button class="btn btn-light" data-view="experiments">Explore cognitive activities →</button><button class="btn btn-white" data-action="add-attention-plan">Add attention example to demo plan · 17:00</button><p class="small subtle">Optional, unscored example; change the time from the plan.</p><p class="small subtle">NASA studies attention, stress, fatigue, workload and sleep quality. ORBIT’s activities are original practice tasks, not NASA’s assessment battery. <a href="https://humanresearchroadmap.nasa.gov/Tasks/task.aspx?i=1623" target="_blank" rel="noopener noreferrer">Read NASA’s research ↗</a></p>':''}${id==='medbay'?'<button class="btn btn-light" data-action="preview-open">Open ultrasound learning preview →</button>':''}</section></div><aside class="module-aside"><section class="module-records"><h2>${copy[2]}</h2>${records}<button class="module-quiet-link" data-view="history">View private history →</button></section><div class="module-note"><b>Your records, in context.</b><p>Your entries stay with their time and method.</p></div></aside></div></div>`}

function recordRow(r){const e=entry(r.type);return `<div class="history-item"><b>${esc(definitions[r.type]?.title||r.type)}</b> <span class="pill">${r.pending?'Pending replay':r.acquisition==='failed'?'Device error · not a reading':'Saved locally'}</span><br><span>${esc(r.summary)}</span><br><small>${esc(r.time)} · ${esc(r.method)} · ${esc(r.quality)} · ${esc(r.context.location)} · ${r.type==='A08'&&!r.fields?.origin?'legacy activity: provenance unverified':'synthetic'}</small>${r.type==='A08'&&r.fields?.origin==='synthetic_fixture'?`<details><summary>Activity data & provenance</summary><p class="small">Fixed synthetic example · ${esc(r.fields.activityVersion)} · ${esc(r.fields.input)} · no live participant data. Practice is excluded. No comparable baseline is available.</p><p class="small">${esc(r.fields.analysis||'')}<br>Trial trace: ${esc(r.fields.trials||'')}</p></details>`:''}${r.type==='A08'&&!r.fields?.origin?'<p class="small">This older record may contain real responses that were incorrectly labeled synthetic by an earlier version. Its origin cannot be verified.</p>':''}<details><summary>Context & next steps</summary><p class="subtle small">${r.acquisition==='failed'?'This attempt was recorded as a device error; no result was interpreted or task completed.':'Recorded; interpretation is unavailable. Your result is shown with its original method and context.'}</p><p class="subtle small">Mission: ${esc(r.context.phase)} · ${esc(r.context.gravity)}. ${e?esc(e.limits):'This routine record does not establish a medical outcome.'}</p><p class="small">${e?sources(e.sourceIds):''}</p><button class="btn-link" data-review="${esc(r.id)}">Prepare a private review note →</button></details></div>`}
function regionDetail(){const types=regions[region]||[];const rs=person().records.filter(r=>types.includes(r.type)),ids=new Set(rs.map(r=>r.id)),notes=person().notes.filter(n=>(n.recordIds||[]).some(id=>ids.has(id)));const dataIssue=rs.some(r=>r.acquisition==='failed'||r.quality==='Uncertain');const status=notes.length?'Review open':dataIssue?'Data issue':rs.length?'Recorded':'No observations';return `<div class="history-item"><b>${esc(region)} · ${status}</b><br>${rs.length?`${rs.length} recorded check-in(s). Latest: ${esc(rs[rs.length-1].time)}.`:'No observations recorded.'} ${notes.length?`${notes.length} private review note(s) saved, not delivered.`:''}${region==='Vision'?'<p class="vision-availability">Vision and ocular methods are listed in the catalog. A validated vision test or ocular measurement is not available in this demo.</p><button class="btn-link" data-view="catalog">Explore the catalog →</button>':''}<br><button class="btn-link" data-view="history">Open records →</button></div>`}
function appsPage(){return `<div class="health-gallery"><div class="gallery-heading"><div><span class="eyebrow">YOUR FIVE MODULES</span><h1>My health</h1><p>Your modules, your plan. Choose where you’d like to start.</p></div><div class="gallery-welcome">${companionArt('proud')}<button class="module-quiet-link" data-view="history">View private records →</button></div></div><div class="destination-grid">${Object.entries(modules).map(([id,m])=>{const t=person().tasks.find(t=>t.day===state.day&&taskInfo(t).module===id&&!t.done&&!t.skipped&&!t.deferred);return `<button class="destination" data-view="${id}">${moduleObject(id)}<span class="destination-name">${m.label}</span><span class="destination-status">${t?`${esc(t.time)} · ${esc(taskInfo(t).title)}`:'No action assigned'}</span><span class="destination-arrow" aria-hidden="true">→</span></button>`}).join('')}</div><p class="gallery-footnote">Your check-ins stay private on this device.</p></div>`}

function more(){const toggles=[['toggle-game','Crew flight','Show the optional simulated voyage',state.gameVisible!==false],['toggle-companion','Earth companion','Show the companion in scenes; assistant is controlled separately',state.companionEnabled!==false],['toggle-assistant','Mission Assistant','Show the optional demo assistant',state.assistantEnabled!==false],['toggle-ui-motion','Reduced motion','Limit animation throughout the app',!!state.uiReducedMotion],['toggle-large-text','Larger reading text','Increase paragraph and form text for this demo persona',!!person().preferences?.largerText],['toggle-spacing','Extra reading spacing','Increase paragraph spacing for this demo persona',!!person().preferences?.extraSpacing]];return `<div class="utilities-page">${title('YOUR MISSION','More to explore','Your records, crew, and reference tools.')}<div class="utility-layout"><section class="utility-links"><div class="section-title"><div><h2>Explore ORBIT</h2><p>Jump to a destination.</p></div></div><div class="utility-destinations">${[['crew','Crew voyage','Aggregate game progress and simulation controls','✦'],['history','Private history','Records, review notes, and staged imports','▤'],['data','Health data','Explore and export demo records','▥'],['training','Procedure preview','Seven chapters of synthetic training','✧'],['catalog','Reference library','Browse 37 source-linked definitions','⌕'],['environment','Cabin context','Synthetic location readings and mission scenario','◉']].map(([id,label,desc,icon])=>`<button class="utility-destination" data-view="${id}"><span class="utility-mark" aria-hidden="true">${icon}</span><span><b>${label}</b><small>${desc}</small></span><span class="utility-arrow" aria-hidden="true">→</span></button>`).join('')}</div></section><aside class="utility-settings"><section class="settings-panel"><span class="eyebrow">MAKE IT YOURS</span><h2>Optional features</h2><p>The health plan and records stay available. System motion preferences are respected.</p>${toggles.map(([action,label,description,on])=>`<button class="setting-row" data-action="${action}" aria-pressed="${on}"><span><b>${label}</b><small>${description}</small></span><span class="setting-status ${on?'on':''}" aria-hidden="true">${on?'On':'Off'}</span></button>`).join('')}</section><section class="reset-panel"><h2>Demo data</h2><p>Reset removes simulated plans, observations, notes and game history from this browser.</p><button class="btn btn-white" data-action="reset">Reset demo data</button></section></aside></div></div>`}

function comparableHistory(){const groups=new Map();for(const r of person().records){const f=r.fields||{},v=Number(f.value);if(f.value===''||f.value==null||!Number.isFinite(v)||['Uncertain','Device reported error'].includes(r.quality))continue;const key=[r.type,r.method,f.unit||'',f.site||'',f.activity||'',r.context.phase,r.context.location,r.context.gravity].join('|');const group=groups.get(key)||[];group.push(r);groups.set(key,group)}const series=[...groups.values()].filter(g=>g.length>=2);if(!series.length)return '<p class="subtle">Add two comparable observations to see a series. Different methods, units, sites, and mission contexts stay separate.</p>';return series.map(g=>`<div class="history-item"><b>${esc(definitions[g[0].type].title)}</b><br><small>${esc(g[0].method)} · ${esc(g[0].fields.unit||'reported value')} · ${esc(g[0].context.location)} · same context</small><br>${g.map(r=>`<span class="series-value">${esc(r.fields.value)} ${esc(r.fields.unit||'')} <small>${esc(r.time)}</small></span>`).join('')}</div>`).join('')}
function history(){const p=person(),pendingImports=p.staged.filter(x=>!x.validated);return `<div class="records-page">${title('PRIVATE · SYNTHETIC','Your history','Original values, methods, quality and mission context stay together.')}<div class="data-entry"><div><b>Want the full picture?</b><span>Explore your records, simulated reviews and training.</span></div><button class="btn btn-light" data-view="data">Open Health Data →</button></div><div class="records-summary" aria-label="History overview"><div><strong>${p.records.length}</strong><span>saved record${p.records.length===1?'':'s'}</span></div><div><strong>${p.notes.length}</strong><span>private review note${p.notes.length===1?'':'s'}</span></div><div><strong>${pendingImports.length}</strong><span>import${pendingImports.length===1?'':'s'} needing details</span></div></div><div class="records-workspace"><section class="records-main"><div class="section-title"><div><h2>Observations &amp; routines</h2><p>Different methods and units stay separate. No automatic interpretation.</p></div></div><div class="records-list">${p.records.length?p.records.slice().reverse().map(recordRow).join(''):'<p class="subtle">No records yet. Choose a check-in from any module to get started.</p>'}</div></section><aside class="records-side"><section class="card"><h2>Private review notes</h2><p class="subtle">Notes stay on this device and are not delivered to a clinician.</p>${p.notes.map(n=>`<div class="history-item">${esc(n.text)}<br><small>${esc(n.time)} · ${(n.recordIds||[]).length} linked record(s) · not delivered · open</small></div>`).join('')||'<p class="subtle">No review notes.</p>'}<button class="btn btn-light" data-action="note">Add review note</button></section><section class="card"><h2>Comparable history</h2><p class="subtle">Original units and methods are preserved. No clinical interpretation is implied.</p>${comparableHistory()}</section><section class="card"><h2>Staged import</h2><p class="subtle">A sample import without units or a source remains outside history until details are supplied.</p><button class="btn btn-light" data-action="stage">Add sample import</button>${pendingImports.map(x=>`<div class="history-item">Heart rate: ${esc(x.value)} · unit missing · method missing<br><button class="btn-link" data-open="A02" data-stage="${esc(x.id)}">Complete details →</button></div>`).join('')}</section></aside></div></div>`}

let cognitive=null, typingSession=null;

function dataRecords(){const p=person();let rows=p.records.filter(r=>(!r.owner||r.owner===state.person)).filter(r=>dataFilter==='all'||(dataFilter==='attention'?r.type==='A08':dataFilter==='failed'?r.acquisition==='failed':definitions[r.type]?.module===dataFilter));return rows.slice().sort((a,b)=>dataSort==='oldest'?String(a.time).localeCompare(String(b.time)):String(b.time).localeCompare(String(a.time)))}
function healthData(){const p=person(),rows=dataRecords(),health=p.health||{episodes:[],procedures:[],audit:[],exportReceipts:[]};return `<div class="records-page">${title('SYNTHETIC · LOCAL','Health data','Explore original entries, the attention example, and review activity for this demo persona.')}<div class="data-shell"><section class="data-main"><div class="data-tools"><div><span class="eyebrow">OBSERVATIONS</span><h2>Record explorer</h2><p>${rows.length} of ${p.records.length} records · ${esc(state.person)}</p><button class="btn-link data-story-link" data-view="mission-signal">Explore the sleep example →</button></div><button class="btn btn-light" data-action="data-sort">${dataSort==='newest'?'Newest first ↓':'Oldest first ↑'}</button></div><div class="data-filters" role="group" aria-label="Filter records">${[['all','All'],['mind','Mind'],['medbay','MedBay'],['fuel','Fuel'],['move','Move'],['recover','Recover'],['attention','Attention'],['failed','Device errors']].map(([id,label])=>`<button class="${dataFilter===id?'active':''}" data-data-filter="${id}" aria-pressed="${dataFilter===id}">${label}</button>`).join('')}</div><div class="data-table-wrap"><table class="data-table"><thead><tr><th scope="col">Observed</th><th scope="col">Observation</th><th scope="col">Original entry</th><th scope="col">Method / quality</th><th scope="col">Details</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.time)}</td><td><b>${esc(definitions[r.type]?.title||r.type)}</b><br><small>${r.pending?'Awaiting simulated replay':r.acquisition==='failed'?'Failed attempt':'Saved locally'}</small></td><td>${esc(r.summary)}</td><td>${esc(r.method||'Not recorded')}<br><small>${esc(r.quality||'Not recorded')}</small></td><td><details><summary>Inspect</summary><dl><dt>Record ID</dt><dd>${esc(r.id)}</dd><dt>Received</dt><dd>${esc(r.receivedAt||'Not recorded for legacy record')}</dd><dt>Original fields</dt><dd><code>${esc(JSON.stringify(r.fields))}</code></dd><dt>Context</dt><dd>${esc(JSON.stringify(r.context))}</dd><dt>Origin</dt><dd>${r.type==='A08'&&!r.fields?.origin?'Legacy activity · provenance unverified':esc(r.fields?.origin||'Synthetic demo entry')}</dd><dt>Analysis</dt><dd>${r.type==='A08'&&r.fields?.origin==='synthetic_fixture'?`${compatibleAttentionRecords(p.records,r).length} matching synthetic example session(s); no validated baseline or diagnosis.`:'No clinical interpretation configured.'}</dd><dt>Follow-up</dt><dd>${health.episodes.filter(e=>e.recordId===r.id&&e.state==='open').length} open simulated review episode(s)</dd></dl></details></td></tr>`).join('')||'<tr><td colspan="5">No records match this filter.</td></tr>'}</tbody></table></div><div class="data-export"><div><h3>Export these ${rows.length} records</h3><p>Exports this persona and current filter only. The JSON includes a manifest, original records, and related synthetic review episodes.</p><button class="btn-link" data-action="export-trials" aria-pressed="${exportTrials}">${exportTrials?'✓ Include synthetic trial traces':'Include synthetic trial traces (optional)'}</button></div><div class="attention-options"><button class="btn btn-primary" data-action="export-data" ${rows.length?'':'disabled'}>Download JSON ↓</button><button class="btn btn-light" data-action="export-csv" ${rows.length?'':'disabled'}>Download CSV ↓</button></div></div><p class="small subtle">This demo uses browser storage without authentication or encryption. Persona selection does not provide security. Do not enter real health data.</p></section><aside class="data-side"><section class="card"><span class="eyebrow">CARE &amp; REVIEW</span><h2>Review episodes</h2><p>Example workflow only. Acknowledgment, simulated review, and resolution are separate.</p>${health.episodes.length?health.episodes.slice().reverse().map(e=>`<div class="review-episode"><b>Attention example · ${esc(e.state)}</b><p>${esc(e.ruleDescription)}</p><small>Acknowledged: ${e.acknowledged?'yes':'no'} · Review: ${esc(e.review)} · Delivery: ${esc(e.delivery)}</small><div class="episode-actions">${!e.acknowledged?`<button data-episode="${esc(e.id)}" data-command="acknowledge">Acknowledge</button>`:''}${e.review==='not_requested'?`<button data-episode="${esc(e.id)}" data-command="queue">Prepare simulated review</button>`:''}${e.review==='queued'?`<button data-episode="${esc(e.id)}" data-command="simulate-review">Simulate review</button>`:''}${e.review==='simulated_reviewed'&&e.state!=='resolved'?`<button data-episode="${esc(e.id)}" data-command="resolve">Resolve example</button>`:''}</div></div>`).join(''):'<p class="subtle">Save the attention example to explore a simulated review episode.</p>'}</section><section class="card"><span class="eyebrow">IMAGING · LEARNING</span><h2>Procedure player</h2><p>Explore a seven-chapter synthetic workflow with a placeholder capture. No clinical instructions or real ultrasound data.</p><button class="btn btn-light" data-action="preview-open">Open training preview →</button><p class="small">${health.procedures.length} training session(s) · ${health.procedures.filter(x=>x.state==='complete').length} completed</p></section><section class="card"><h2>Processing &amp; scope</h2><p>Records are saved locally. No background monitoring, clinical rules, prescriptions, device feeds, or remote delivery are configured.</p><p class="small"><b>Last received:</b> ${esc(p.records.filter(r=>r.receivedAt).map(r=>r.receivedAt).sort().at(-1)||'Not recorded')}<br><b>Last demo processing:</b> ${esc(health.episodes.map(e=>e.createdAt).sort().at(-1)||'None')}<br><b>Next expected:</b> Not configured</p><p class="small">${health.audit.length} local workflow events · ${health.exportReceipts.length} export receipt(s).</p><button class="btn-link" data-view="history">Back to history →</button></section></aside></div></div>`}
function experimentsPage(){const s=cognitive;if(!s)return `${title('MIND · EXPERIMENTAL','Cognitive activities','Short software activities you can try in this browser.')}<div class="experiment-grid">${Object.entries(COGNITIVE_TASKS).map(([key,t])=>`<section class="attention-card activity-option">${moduleObject('mind','activity-art')}<span class="eyebrow">EXPERIMENTAL · ${t.durationMs/1000} SECONDS</span><h2>${esc(t.label)}</h2><p>${key==='symbol'?'Use the displayed key to match each symbol to a number.':'Decide whether the current symbol matches the one two steps earlier.'}</p><button class="btn btn-primary" data-cognitive-start="${key}">Practice →</button></section>`).join('')}<section class="attention-card activity-option">${moduleObject('recover','activity-art')}<span class="eyebrow">EXPERIMENTAL · 60 SECONDS</span><h2>Keyboard copy</h2><p>Copy a neutral passage. Only a temporary summary is shown; typed text is discarded.</p><button class="btn btn-primary" data-view="typing">Open activity →</button></section></div><p class="subtle">Your responses stay in this session and are discarded when you leave, switch persona or reload. These practice activities do not complete a scheduled task.</p>`;const task=COGNITIVE_TASKS[s.kind],sum=cognitiveSummary(s),active=['practice','measuring'].includes(s.phase);return `${title('MIND · SESSION ONLY',esc(task.label),`Experimental browser activity · ${esc(task.version)}`)}<section class="attention-card cognitive-card"><span class="eyebrow">${s.phase==='practice'?'PRACTICE':s.phase==='measuring'?'MEASUREMENT':s.phase==='complete'?'COMPLETE':'INTERRUPTED'}</span><h2>${s.phase==='complete'?'Nice work ✨':s.phase==='interrupted'?'Session interrupted':s.phase==='practice-done'?'Ready for the activity?':s.kind==='symbol'?'Match the symbol':'Does it match two steps back?'}</h2>${active?`${s.kind==='symbol'?'<p>Key: ◆ = 1 &nbsp; ● = 2 &nbsp; ▲ = 3 &nbsp; ■ = 4</p>':'<p>The first two symbols are warm-up. After that, compare with the symbol two steps back.</p>'}<div class="cognitive-stimulus" aria-live="polite">${esc(s.current)}</div><div class="attention-options">${(s.kind==='symbol'?[['1','1'],['2','2'],['3','3'],['4','4']]:[['match','Match'],['different','Different']]).map(([v,l])=>`<button class="btn btn-light" data-cognitive-answer="${v}">${l}</button>`).join('')}</div><p class="small">${s.phase==='practice'?`${s.practice.length} of 3 practice responses`:`${s.responses.length} responses · keep this tab visible`}</p>`:''}${s.phase==='practice-done'?`<p>Practice is separate from the result. The activity lasts ${task.durationMs/1000} seconds.</p><button class="btn btn-primary" data-action="cognitive-measure">Start activity →</button>`:''}${s.phase==='complete'?`<div class="attention-results"><span><b>${sum.attempts}</b> scored</span><span><b>${sum.correct}</b> correct</span><span><b>${sum.incorrect}</b> incorrect</span><span><b>${sum.medianMs??'—'}</b> ms median</span></div><p class="small">Software response timing does not account for physical display or input latency.</p>${s.kind==='twoback'?`<p>Matches found: ${sum.hits} · Misses: ${sum.misses} · False alarms: ${sum.falseAlarms} · Correct rejections: ${sum.correctRejections}</p>`:''}<p>No clinical interpretation or comparable baseline is available. This result is not saved.</p>`:''}${s.phase==='interrupted'?'<p>No result or task credit was saved.</p>':''}${s.phase==='measuring'?'<button class="btn-link" data-action="cognitive-stop">Stop activity</button>':''}<p class="small">Live responses stay in this page’s memory only. There is no camera, keyboard surveillance, or remote connection.</p><button class="btn-link" data-action="cognitive-exit">← Activities</button></section>`}
function typingPage(){const t=typingSession;return `${title('MIND · SESSION ONLY','Keyboard copy activity','A neutral 60-second experimental activity.')}<section class="attention-card"><span class="eyebrow">${t?.phase==='measuring'?'IN PROGRESS':t?.phase==='complete'?'COMPLETE':t?.phase==='interrupted'?'INTERRUPTED':'READY WHEN YOU ARE'}</span>${!t?`<h2>Copy a little space note</h2><p>Copy the passage into the box for 60 seconds. Text and input events stay in memory and are discarded afterward. A summary is shown temporarily and never saved. This is not a clinical test.</p><button class="btn btn-primary" data-action="typing-start">Start activity →</button><p class="small">Starting means you agree to temporary processing. The activity only reads the text entered into its own box.</p>`:t.phase==='measuring'?`<p>Copy this passage:</p><blockquote class="typing-passage">${esc(COPY_PASSAGE)}</blockquote><label class="field">Your copy<textarea id="typing-input" maxlength="512" spellcheck="false" autocomplete="off" aria-describedby="typing-note"></textarea></label><p id="typing-note" class="small">You may stop at any time. The session ends after 60 seconds.</p><button class="btn-link" data-action="typing-stop">Stop activity</button>`:t.phase==='complete'?`<h2>Activity complete ✨</h2><div class="attention-results"><span><b>${t.result.characters}</b> characters</span><span><b>${t.result.passageEdits}</b> edits from passage</span><span><b>${t.result.corrections}</b> delete events</span></div><p>These are descriptive counts, not a diagnosis. The typed text was discarded and cannot be replayed.</p><button class="btn btn-light" data-action="typing-reset">Try again</button>`:`<h2>Session interrupted</h2><p>Your text was discarded. No result or task credit was saved.</p><button class="btn btn-light" data-action="typing-reset">Try again</button>`}<button class="btn-link" data-view="experiments">← Activities</button></section>`}
function stopTyping(){if(typingSession)clearTimeout(typingSession.timer)}
function interruptTyping(){if(typingSession?.phase==='measuring'){stopTyping();typingSession.phase='interrupted';if(view==='typing')render()}}
function startTyping(){stopTyping();const t=typingSession={phase:'measuring',owner:state.person,corrections:0,start:performance.now()};t.timer=setTimeout(()=>finishTyping(t),60000);render();focusAfter('#typing-input')}
function finishTyping(t){if(typingSession!==t||t.phase!=='measuring')return;const elapsed=performance.now()-t.start;if(elapsed<60000){t.timer=setTimeout(()=>finishTyping(t),60000-elapsed);return}const text=document.querySelector('#typing-input')?.value||'';t.result=scoreCopy(text,t.corrections);t.phase='complete';render()}
function stopCognitive(){if(cognitive)clearTimeout(cognitive.timer)}
function interruptCognitive(){if(cognitive&&['practice','practice-done','measuring'].includes(cognitive.phase)){stopCognitive();cognitive.phase='interrupted';cognitive.interrupted=true;if(view==='experiments')render()}}
function startCognitive(kind){stopCognitive();cognitive=newCognitive(kind,state.person);if(!cognitive)return;nextCognitive(cognitive,Math.random,performance.now());view='experiments';render();focusAfter('[data-cognitive-answer]')}
function cognitiveAnswer(value){const s=cognitive;if(!s||s.owner!==state.person)return;if(s.phase==='measuring'&&performance.now()-s.startedMono>=COGNITIVE_TASKS[s.kind].durationMs){finishCognitive(s);return}if(!answerCognitive(s,value,performance.now()))return;if(s.phase==='practice'&&s.practice.length===3){s.phase='practice-done';render();focusAfter('[data-action="cognitive-measure"]');return}nextCognitive(s,Math.random,performance.now());render();focusAfter(`[data-cognitive-answer="${value}"]`)}
function finishCognitive(s){if(cognitive!==s||s.phase!=='measuring')return;const elapsed=performance.now()-s.startedMono;if(elapsed<COGNITIVE_TASKS[s.kind].durationMs){s.timer=setTimeout(()=>finishCognitive(s),COGNITIVE_TASKS[s.kind].durationMs-elapsed);return}stopCognitive();s.phase='complete';s.elapsedMs=Math.round(elapsed);s.current=null;render()}
function cognitiveMeasure(){const s=cognitive;if(!s||s.phase!=='practice-done'||document.hidden)return;s.phase='measuring';s.startedAt=new Date().toISOString();s.startedMono=performance.now();nextCognitive(s,Math.random,performance.now());s.timer=setTimeout(()=>finishCognitive(s),COGNITIVE_TASKS[s.kind].durationMs);render();focusAfter('[data-cognitive-answer]')}
const previewCopy=[['Set the scene','This learning preview demonstrates the structure of a guided acquisition workflow. No medical procedure has been approved or included.'],['Readiness','A real procedure would specify the equipment, training and supervision it requires. Those details are not configured in this preview.'],['Orientation','Reviewed anatomical visuals and device-specific orientation are not available. This screen intentionally contains no scan instructions.'],['Guided capture','Create an illustrative placeholder to practice the record workflow. It is not an ultrasound image and contains no medical information.'],['Quality comparison','Approved comparison images and quality criteria are not available. A placeholder capture cannot establish image adequacy.'],['Submission and review','Save the placeholder to the demo queue and optionally simulate a review. Neither action sends a file or reaches a clinician.'],['Closure','Finish the learning preview. Training completion does not mean an examination was performed, reviewed, or medically resolved.']];
function trainingPage(){const health=person().health||{procedures:[]},s=health.procedures.find(x=>x.id===previewId&&x.owner===state.person);if(!s)return `${title('MEDBAY · LEARNING','Ultrasound workflow preview','A synthetic walkthrough with no clinical scan instructions.')}<section class="attention-card"><h2>Explore the seven-chapter player</h2><p>Practice navigating a procedure, creating a placeholder capture and following a simulated review. Your progress stays in this browser for the selected demo persona.</p><button class="btn btn-primary" data-action="preview-start">Start or resume preview →</button><p class="small">Reviewed visuals, equipment settings and operational steps are not yet available. This preview cannot activate a clinical procedure.</p></section>`;const [heading,body]=previewCopy[s.chapter];return `<div class="training-page">${title('SYNTHETIC TRAINING ONLY','Ultrasound workflow preview','No clinical scan instructions · No patient data · No clinician connected')}<div class="training-layout"><nav class="training-chapters" aria-label="Training chapters">${PREVIEW_PACKAGE.chapters.map((c,i)=>`<span class="${i===s.chapter?'current':''}"><b>${i+1}</b>${esc(c)}${i===s.chapter?' · current':''}</span>`).join('')}</nav><section class="training-stage"><div class="training-art" aria-hidden="true"><span class="training-illustration">${moduleObject('medbay')}</span><span class="training-route"><i>01</i><b></b><i>02</i><b></b><i>03</i></span><span class="training-art-caption">ILLUSTRATIVE WORKFLOW · NOT A SCAN</span></div><div class="eyebrow">CHAPTER ${s.chapter+1} OF 7 · ${esc(PREVIEW_PACKAGE.chapters[s.chapter].toUpperCase())}</div><h2>${esc(heading)}</h2><p>${esc(body)}</p>${s.chapter===3?`<button class="btn btn-light" data-preview="capture" ${s.artifact?'disabled':''}>${s.artifact?'Placeholder created ✓':'Create synthetic placeholder'}</button>`:''}${s.chapter===4?`<div class="notice">Capture: ${s.artifact?'synthetic placeholder available':'missing'} · Adequacy: not assessed · Clinical interpretation: unavailable</div>`:''}${s.chapter===5?`<div class="notice">Capture: ${s.artifact?'synthetic placeholder':'missing'} · Submission: ${esc(s.submission)} · Review: ${esc(s.review)}</div><div class="attention-options"><button class="btn btn-light" data-preview="submit" ${!s.artifact||s.submission!=='not_submitted'?'disabled':''}>Save simulated submission</button><button class="btn btn-light" data-preview="review" ${s.review!=='queued_simulated'?'disabled':''}>Simulate review</button></div>`:''}${s.chapter===6?`<div class="notice">Training: ${esc(s.state)} · Capture: ${s.artifact?'placeholder only':'not made'} · Review: ${esc(s.review)}. No clinical conclusion.</div>`:''}<div class="training-controls"><button class="btn btn-white" data-preview="back" ${s.chapter===0||s.state==='complete'?'disabled':''}>← Back</button>${s.chapter<6?'<button class="btn btn-primary" data-preview="next">Next chapter →</button>':`<button class="btn btn-primary" data-preview="complete" ${s.state==='complete'?'disabled':''}>${s.state==='complete'?'Preview completed ✓':'Finish preview'}</button>`}</div><button class="btn-link" data-view="data">Return to health data →</button></section></div></div>`}

function crewScene(active,rows){const me=rows.find(r=>r.player),near=rows.filter(r=>!r.player).sort((a,b)=>Math.abs(a.progress-me.progress)-Math.abs(b.progress-me.progress)).slice(0,2);return `<div class="crew-viewport" aria-label="Simulated preview of nearby crews"><div class="crew-nebula" aria-hidden="true"></div><div class="crew-destination" aria-hidden="true"></div><div class="crew-orbit" aria-hidden="true"></div><div class="crew-fleet">${[near[0],me,near[1]].map((r,i)=>{const x=42+(r.progress-me.progress)*.95,y=[20,49,77][i];return x<20||x>76?`<span class="crew-fleet-edge ${x<20?'left':'right'}" style="--crew-y:${y}%">${x<20?'←':'→'} ${esc(r.name)} · ${Math.abs(Math.round(r.progress-me.progress))} units</span>`:`<button class="crew-ship ${r.player?'crew-player':''} ${r.id===chosenRacer?'crew-ship-selected':''}" data-crew-racer="${esc(r.id)}" aria-pressed="${r.id===chosenRacer}" aria-label="Select ${esc(r.name)}, ${ordinal(r.rank)} place" style="--crew-x:${x}%;--crew-y:${y}%"><span class="crew-ship-label">${esc(r.player?'Kite · your crew':r.name+' · simulated')} <b>${ordinal(r.rank)}</b></span>${raceShip(r)}</button>`}).join('')}</div><span class="crew-scene-caption">Fictional crews · projected positions</span></div>`}
function crewFleetPanel(rows){const me=rows.find(r=>r.player),selected=rows.find(r=>r.id===chosenRacer)||me,diff=selected.progress-me.progress,comparison=selected.player?'Your crew':diff===0?'Level with your crew':`${Math.abs(diff).toFixed(1)} units ${diff>0?'ahead of':'behind'} your crew`;return `<section class="crew-fleet-panel" aria-label="Projected crew standings"><div class="crew-fleet-title"><div><span class="crew-overline">THE FLEET · PROJECTED</span><h2>Meet the crews</h2><p>Select a ship to explore its position.</p></div><button class="crew-fleet-route" data-view="race">Open the race →</button></div><div class="crew-fleet-layout"><div class="crew-roster" role="group" aria-label="Choose a crew">${rows.map(r=>`<button class="crew-roster-item ${r.id===selected.id?'selected':''}" data-crew-racer="${esc(r.id)}" aria-pressed="${r.id===selected.id}"><span class="crew-roster-rank">${ordinal(r.rank)}</span><span class="crew-roster-ship" aria-hidden="true">${raceShip(r)}</span><span class="crew-roster-name"><b>${esc(r.name)}</b><small>${r.player?'Your crew':'Simulated crew'}</small></span><strong>${r.progress.toFixed(1)} <small>units</small></strong></button>`).join('')}</div><aside class="crew-spotlight" aria-live="polite"><span class="crew-overline">${selected.player?'YOUR CREW':'CREW SPOTLIGHT'}</span><div class="crew-spotlight-ship" aria-hidden="true">${raceShip(selected)}</div><h3>${esc(selected.name)}</h3><p>${ordinal(selected.rank)} place · ${selected.progress.toFixed(1)} projected units</p><span class="crew-comparison">${esc(comparison)}</span><button class="crew-fleet-route" data-view="race">Explore the flight →</button></aside></div><p class="crew-fleet-note">Projected positions update from completed plan actions; all other crews are simulated.</p></section>`}

function crew(){if(state.gameVisible===false)return `<div class="crew-page"><header class="crew-page-heading"><div><span class="eyebrow">CREW · OPTIONAL</span><h1>Crew voyage</h1><p>Your health plan and records stay available.</p></div><button class="crew-plan-link" data-view="home">← Today’s plan</button></header><section class="crew-hero crew-disabled"><div class="crew-hero-copy"><span class="crew-overline">VOYAGE PAUSED</span><h2>Crew flight is off.</h2><p>Turn on the simulated flight whenever you want to explore the shared voyage.</p><div class="crew-hero-actions"><button class="btn btn-primary" data-action="toggle-game">Enable crew flight →</button></div></div><div class="crew-viewport" aria-hidden="true"><div class="crew-nebula"></div><div class="crew-destination"></div><div class="crew-orbit"></div></div></section><section class="crew-tools"><div><h2>Demo connection</h2><p>Simulate a connection loss and replay local changes.</p></div><div class="crew-tools-actions"><button class="btn btn-light" data-action="toggle-offline">${state.offline?'Reconnect and replay':'Simulate offline'}</button></div></section></div>`;const included=crewRoster(state).includes(state.person),personal=included?score(person().tasks.filter(t=>t.day===state.day),person().paused):null,active=crewRaceData(),rows=rankCrewRace(active),me=rows.find(r=>r.player),participation=!included?'Not in today’s crew':person().paused?'Paused':personal===null?'No eligible plan actions':'Participating';return `<div class="crew-page"><header class="crew-page-heading"><div><span class="eyebrow">CREW · SIMULATED</span><h1>Crew voyage</h1><p>Follow your shared journey, one plan at a time.</p></div><button class="crew-plan-link" data-view="home">← Today’s plan</button></header><section class="crew-hero"><div class="crew-hero-copy"><span class="crew-overline"><span aria-hidden="true">✦</span> YOUR CREW · KITE</span><h2>Further, together.</h2><p>A shared flight powered by completed plan actions. Health records and answers stay on this device.</p><div class="crew-hero-actions"><button class="btn btn-primary" data-view="race">Open crew race <span aria-hidden="true">→</span></button><button class="crew-how-link" data-action="crew-how">How it works ↓</button></div></div>${crewScene(active,rows)}</section><section class="crew-route-summary" aria-label="Crew progress"><div><span>Projected place</span><strong>${ordinal(me.rank)} <small>of ${rows.length} crews</small></strong></div><div><span>Projected position</span><strong>${me.progress.toFixed(1)} <small>units</small></strong></div><div><span>Settled position</span><strong>${active.settled.toFixed(1)} <small>units</small></strong></div><p>${active.noScoredLeg?'No scored leg today.':`Today’s projected leg: ${active.leg.toFixed(1)} units.`} Positions are simulated and may change before settlement.</p></section>${crewFleetPanel(rows)}<div class="crew-controls-grid"><section class="crew-control-card"><div class="crew-control-mark" aria-hidden="true">✦</div><div><span class="eyebrow">YOUR PARTICIPATION</span><h2>${participation}</h2><p>${!included?'This persona is not on the current roster.':person().paused?'Your health plan remains available while participation is paused.':'Your private check-ins stay private. Pending changes count after replay.'}</p><button class="btn btn-light" data-action="pause" ${!included?'disabled aria-describedby="crew-roster-note"':''}>${person().paused?'Resume participation':'Pause participation'}</button>${!included?'<small id="crew-roster-note">Available to today’s roster.</small>':''}</div></section><section class="crew-control-card crew-mode-card"><div class="crew-control-mark" aria-hidden="true">⌁</div><div><span class="eyebrow">CREW MODE</span><h2>${state.crewMode==='solo'?'Solo flight':'Crew flight'}</h2><p>Today’s roster stays fixed. Next mission day: <b>${(state.nextCrewMode||'pair')==='solo'?'Solo':'Crew'}</b>.</p><button class="btn btn-light" data-action="change-crew">${(state.nextCrewMode||'pair')==='solo'?'Choose crew for next day':'Choose solo for next day'}</button></div></section></div><section class="crew-tools"><div><h2>Simulation controls</h2><p>Try offline replay or settle today’s accepted progress.</p></div><div class="crew-tools-actions"><button class="btn btn-light" data-action="toggle-offline">${state.offline?'Reconnect and replay':'Simulate offline'}</button><button class="btn btn-white" data-action="advance">Settle day & advance →</button></div></section><details class="crew-explainer" id="crew-how"><summary>How crew progress works</summary><p>Each eligible crew member contributes equally, regardless of plan size. A scored day earns 20 + 80 × the crew mean; when everyone pauses, no distance is awarded. Today’s leg is projected until it is settled. Values, private answers, and pause reasons are not shared.</p></details></div>`}

function catalogPage(){let filtered=catalog.entries.filter(e=>(e.title+' '+e.module+' '+e.implementation).toLowerCase().includes(query.toLowerCase()));return `<div class="catalog-page">${title('SOURCE-LINKED REFERENCE','Observation library','37 definitions for exploration—not a daily testing plan.')}<div class="catalog-toolbar"><label class="field">Search definitions<input id="catalog-search" value="${esc(query)}" placeholder="Search by name or module"></label><p class="subtle">${filtered.length} entries · no clinical procedures or thresholds configured</p></div><div class="catalog-results">${filtered.map(e=>`<details class="catalog-row"><summary><span>${esc(e.title)}</span><span class="pill">${esc(e.implementation.replaceAll('_',' '))}</span></summary><p>${esc(e.quantity)}</p><p><b>Equipment:</b> ${esc((e.equipment||[]).join('; ')||'Not specified')}<br><b>Limits:</b> ${esc(e.limits)}<br><b>Assignment:</b> Unassigned by default · <b>Clinical interpretation:</b> Unavailable</p><p>${sources(e.sourceIds)}</p></details>`).join('')||'<p class="subtle">No matching definitions.</p>'}</div></div>`}

function crewRaceData(){const fractions=crewRoster(state).map(name=>state.people[name]).filter(Boolean).map(p=>score(p.tasks.filter(t=>t.day===state.day),p.paused));return {settled:280+state.settlements.reduce((sum,item)=>sum+item.distance,0),leg:distance(fractions),noScoredLeg:!fractions.some(x=>x!==null)}}
function raceShip(r){const color=raceColors[r.paint]||raceColors.mint,shapes={swift:['M52 24 28 6 60 13 84 22M52 46 28 64 60 57 84 48','M24 24C42 16 91 14 119 22c10 3 20 9 25 13-5 5-15 10-25 13-28 8-77 6-95-2-5-6-5-16 0-22Z'],wing:['M52 24 11 4 40 7 85 21M52 46 11 66 40 63 85 49','M26 22C48 18 90 17 123 25l20 10-20 10C90 53 48 52 26 48Z'],round:['M48 25 33 11 58 11 81 22M48 45 33 59 58 59 81 48','M20 35C20 17 54 12 87 15c24 2 46 10 55 20-9 10-31 18-55 20-33 3-67-2-67-20Z'],delta:['M48 25 8 10 41 16 100 28M48 45 8 60 41 54 100 42','M24 23 94 18 145 35 94 52 24 47 15 35Z'],fork:['M58 24 38 3 57 7 89 22M58 46 38 67 57 63 89 48','M20 25 43 21 111 19 141 26 127 35 141 44 111 51 43 49 20 45Z'],pod:['M45 24 29 10 43 9 64 23M45 46 29 60 43 61 64 47','M22 26C31 16 53 14 71 19l15 5 34-3 24 14-24 14-34-3-15 5c-18 5-40 3-49-7Z']},[wing,body]=shapes[r.hull]||shapes.swift;return `<svg class="racer-ship" viewBox="0 0 150 70" aria-hidden="true"><g class="engine-trail"><path d="M20 27C4 26 1 33 0 35c5 4 11 8 20 8" fill="#c4f8ec" opacity=".8"/><path d="M23 30 4 35l19 5" fill="#fff5c6"/></g><g fill="${color}" stroke="#101b36" stroke-width="3.5" stroke-linejoin="round"><path d="${wing}"/><path d="${body}"/></g><path d="M31 28c25-4 75-6 93 0" fill="none" stroke="#fff9e9" stroke-width="3" opacity=".8"/><path d="M71 24c6-8 24-8 33 0 2 2 3 4 4 7H70Z" fill="#dff9fb" stroke="#101b36" stroke-width="3"/><path d="M28 27v16M34 25v20" stroke="#243658" stroke-width="3"/><circle cx="122" cy="35" r="3" fill="#fff9e9"/></svg>`}

function ordinal(n){return n+(n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th')}
function shipLanes(active,displayPlayer,mode){const all=rankCrewRace({...active,settled:mode==='settled'?displayPlayer:active.settled,leg:mode==='projected'?displayPlayer-active.settled:active.leg},mode),final=rankCrewRace(active,mode),lanes={comet:19,lyra:31,kepler:43,player:56,vega:69,halo:82};return all.map(r=>{const actual=final.find(x=>x.id===r.id),x=crewRacePosition(r.progress,displayPlayer),name=r.player?'Kite · your crew':r.name+' · simulated';if(x<14||x>86)return `<div class="race-edge ${x<14?'left':'right'}" style="--y:${lanes[r.id]}%">${x<14?'←':'→'} ${esc(r.name)} · ${Math.abs(Math.round(r.progress-displayPlayer))} units</div>`;return `<button class="racer ${r.player?'racer-player':''} ${r.id===chosenRacer?'racer-selected':''}" data-racer="${esc(r.id)}" data-progress="${actual.progress}" style="--x:${x}%;--y:${lanes[r.id]}%" aria-pressed="${r.id===chosenRacer}" aria-label="${esc(name)}, ${ordinal(r.rank)} place, ${r.progress.toFixed(1)} units"><span class="racer-label">${esc(r.name)} <b>#${r.rank}</b></span>${raceShip(r)}</button>`}).join('')}
function raceDock(rows){return `<section class="race-dock" aria-label="Choose a crew"><div class="race-dock-heading"><div><span class="race-dock-kicker">THE FLEET</span><h2>Choose a ship</h2></div><span>Tap to explore</span></div><div class="race-dock-list" role="group" aria-label="Select a crew">${rows.map(r=>`<button class="race-dock-pick ${r.id===chosenRacer?'selected':''}" data-race-pick="${esc(r.id)}" aria-pressed="${r.id===chosenRacer}"><span class="race-dock-rank">${ordinal(r.rank)}</span><span class="race-dock-art" aria-hidden="true">${raceShip(r)}</span><span><b>${esc(r.name)}</b><small>${r.player?'Your crew':'Simulated crew'}</small></span><strong>${r.progress.toFixed(1)} <small>units</small></strong></button>`).join('')}</div></section>`}
function racePage(){if(state.gameVisible===false)return `${title('OPTIONAL CREW FEATURE','Crew flight is off','Your health plan and records remain available.')}<section class="card"><p class="subtle">Enable the optional flight scene when you want to see simulated crew progress.</p><button class="btn btn-primary" data-action="toggle-game">Enable crew flight</button></section>`;const active=crewRaceData(),all=rankCrewRace(active,raceMode),me=all.find(x=>x.player),initial=(raceMode==='projected'&&typeof requestAnimationFrame==='function'&&raceChange)?raceChange.before:me.progress,display=rankCrewRace({...active,leg:initial-active.settled},raceMode),initialRank=display.find(x=>x.player).rank,selected=all.find(x=>x.id===chosenRacer)||me;return `<div class="race-experience ${state.raceReducedMotion?'reduce-motion':''}"><header class="race-header"><div><span class="race-kicker">SIMULATED CREW FLIGHT</span><h1>Crew voyage</h1><p>Six fictional crews · no live connection · progress is not a health score.</p></div><div class="race-header-actions"><button class="race-button ghost" data-action="race-mode">${raceMode==='projected'?'View settled voyage':'View projected today'}</button><button class="race-button ghost" data-action="race-motion">${state.raceReducedMotion?'Enable motion':'Pause motion'}</button><button class="race-button ghost" data-view="home">Health plan ↗</button></div></header><section class="race-stage" aria-label="Simulated crew flight"><div class="race-backdrop" aria-hidden="true"></div><div class="race-scrim" aria-hidden="true"></div><div class="race-stage-top"><div class="hud-rank"><span>${raceMode==='projected'?'PROJECTED POSITION':'SETTLED POSITION'}</span><strong id="race-rank">${ordinal(initialRank)} <small>/ ${all.length}</small></strong></div><div class="hud-destination"><span>STATUS</span><b>${raceMode==='projected'?'Projected today':'Settled voyage'}</b><small>Simulated · mission units</small></div></div><svg class="race-orbit-lines" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><path d="M-80 465 C180 330 290 300 520 260 S840 185 1090 40"/><path d="M-100 475 C130 390 340 380 560 315 S865 260 1080 170"/><circle cx="225" cy="350" r="5"/><circle cx="796" cy="211" r="7"/></svg><div class="race-lanes" aria-label="Crew vessel positions">${shipLanes(active,initial,raceMode)}</div><div class="race-stage-bottom"><div class="flight-meter"><span>YOUR ${raceMode==='projected'?'PROJECTED':'SETTLED'} POSITION <b id="race-progress">${initial.toFixed(1)}</b> UNITS</span></div><span class="simulation-tag">● SIMULATED CREWS</span></div><div class="race-celebrate" aria-live="polite">${raceChange&&raceMode==='projected'?'A saved plan action changed today’s provisional projection.':'Positions reflect accepted state, not background motion.'}</div></section>${raceDock(all)}<div class="race-under"><section class="race-next"><span class="race-kicker">RETURN TO YOUR HEALTH PLAN</span><h2>One plan, shared progress</h2><p>Following your assigned plan can update the crew projection. Values and private answers never determine credit.</p><button class="race-button primary" data-view="home">Open today’s plan →</button><small>${active.noScoredLeg?'No scored leg today':`Projected leg: ${active.leg.toFixed(1)} units`} · settled voyage: ${active.settled.toFixed(1)} units.</small></section><section class="race-neighbors"><span class="race-kicker">SELECTED CREW</span><h2>${esc(selected.name)} ${selected.player?'· your crew':'· simulated'}</h2><p>${ordinal(selected.rank)} place · ${selected.progress.toFixed(1)} ${raceMode==='projected'?'projected':'settled'} units.</p><button class="btn btn-light" data-view="crew">Crew settings</button></section></div><details class="race-standings"><summary>Route overview · all six crews</summary><ol>${all.map(r=>`<li><button data-racer="${esc(r.id)}"><span class="standing-color ${esc(r.paint)}"></span><b>${esc(r.player?'Kite · your crew':r.name+' · simulated')}</b><span>${ordinal(r.rank)} · ${r.progress.toFixed(1)} units</span></button></li>`).join('')}</ol></details><p class="race-footnote">Synthetic snapshots, not live competition. Ties share a place. Ship size and lane do not affect rank.</p></div>`}
function animateRace(){if(view!=='race'||raceMode!=='projected'||!raceChange)return;if(typeof requestAnimationFrame!=='function'||!app.querySelectorAll){raceChange=null;return}const change=raceChange;raceChange=null;const reduce=!!state.raceReducedMotion||!!state.uiReducedMotion||!!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;requestAnimationFrame(()=>requestAnimationFrame(()=>{for(const el of app.querySelectorAll('.racer'))el.style.setProperty('--x',crewRacePosition(Number(el.dataset.progress),change.after)+'%');app.querySelector('.race-stage')?.classList.add('boosting');setTimeout(()=>{if(view!=='race')return;render()},reduce?0:1100)}))}
function previewRace(){const data=crewRaceData(),rows=rankCrewRace(data),me=rows.find(x=>x.player);return `<section class="health-flight"><div class="health-flight-head"><div><span class="health-kicker">OPTIONAL · SIMULATED</span><h2>Crew flight</h2></div><button class="health-text-link" data-view="race">Open race →</button></div><div class="health-flight-art" aria-hidden="true">${voyageArt(data.leg/100)}</div><div class="health-flight-detail"><b>${ordinal(me.rank)} of ${rows.length} crews · projected</b><span>${me.progress.toFixed(1)} projected units</span></div><p>${data.noScoredLeg?'No scored leg today. ':''}Settled: ${data.settled.toFixed(1)} units. Your records stay private.</p></section>`}
function field(label,name,opts={}){return `<label class="field ${opts.full?'full':''}">${label}${opts.options?`<select name="${name}" ${opts.required?'required':''}>${opts.options.map((v,i)=>`<option value="${esc(v)}" ${opts.placeholder&&i===0?'disabled selected':''}>${esc(v)}</option>`).join('')}</select>`:opts.textarea?`<textarea name="${name}" ${opts.required?'required':''} placeholder="${esc(opts.placeholder||'')}"></textarea>`:`<input name="${name}" type="${opts.type||'text'}" ${opts.required?'required':''} ${opts.type==='number'?'step="any" min="0"':''} placeholder="${esc(opts.placeholder||'')}" value="${esc(opts.value||'')}">`}</label>`}
function mealPlate(){const groups=[['fruits','Fruit','🍓'],['grains','Grains','🌾'],['vegetables','Vegetables','🥦'],['protein','Protein','🥜'],['dairy','Dairy or alternative','🥛']];return `<fieldset class="meal-picker full"><legend>Build your meal</legend><p>Choose the food groups you had. You can select any combination.</p><div class="meal-plate">${groups.map(([id,label,icon])=>`<label class="plate-group plate-${id}"><input type="checkbox" name="food_${id}" value="yes"><span><i aria-hidden="true">${icon}</i><b>${label}</b><small>Tap to add</small></span></label>`).join('')}</div><small>Food-group labels are inspired by <a href="https://www.myplate.gov/" target="_blank" rel="noopener noreferrer">USDA MyPlate ↗</a>. This is a meal log, not an astronaut nutrition prescription.</small></fieldset>`}
function inputs(type){let f='';const select=(l,n,options,req=true)=>field(l,n,{options:['Choose…',...options],placeholder:true,required:req});if(type==='A01')f=field('Systolic · mmHg','systolic',{type:'number',required:true})+field('Diastolic · mmHg','diastolic',{type:'number',required:true})+field('Device / method','method',{required:true,placeholder:'e.g. cuff monitor'})+field('Measurement site','site',{required:true,placeholder:'e.g. upper arm'})+select('Posture','posture',['Seated','Reclined','Other']);
if(type==='A02')f=field('Rate · beats/min','value',{type:'number',required:true,value:modal.stage?person().staged.find(x=>x.id===modal.stage)?.value:''})+select('Measurement method','method',['Manual count','Peripheral pulse device','ECG-derived heart rate'])+select('Activity context','activity',['Rest','During activity','After activity','Unknown'])+(modal.stage?select('Confirm original unit','unit',['beats/min']):'');
if(type==='A03')f=field('Glucose value','value',{type:'number',required:true})+select('Original unit','unit',['mg/dL','mmol/L'])+select('Source / specimen','method',['Blood meter','Laboratory blood result','Interstitial sensor'])+select('Meal context','meal',['Before meal','After meal','Unknown']);
if(type==='A04')f=field('Temperature','value',{type:'number',required:true})+select('Original unit','unit',['°C','°F'])+select('Measurement site','site',['Oral','Ear','Forehead','Underarm','Other'])+field('Instrument / method','method',{required:true});
if(type==='A05')f=field('Reported duration · hours','value',{type:'number',required:true})+field('Timezone','timezone',{required:true,value:'UTC'})+field('Awakenings (optional)','awakenings',{type:'number'})+select('Perceived quality','qualityReport',['Restful','Mixed','Not restful','Prefer not to say']);
if(type==='A06')f=`<fieldset class="feeling-picker full"><legend>How are you feeling right now?</legend><p>Choose the answer that feels closest. Every question is optional.</p><div class="feeling-options">${[['Low','Having a hard time','☁'],['Neutral','In between','◒'],['Good','Feeling good','✦']].map(([value,label,symbol])=>`<label class="feeling-option"><input type="radio" name="mood" value="${value}"><span>${companionArt('listen',true)}<i aria-hidden="true">${symbol}</i><b>${label}</b></span></label>`).join('')}<label class="feeling-option feeling-skip"><input type="radio" name="mood" value="Prefer not to say"><span><b>Prefer not to say</b></span></label></div></fieldset>`+select('How stressed do you feel? (optional)','stress',['Low','Moderate','High','Prefer not to say'],false)+select('How tired do you feel? (optional)','fatigue',['Low','Moderate','High','Prefer not to say'],false)+field('Anything else on your mind? (optional)','notes',{textarea:true,full:true,placeholder:'Share as much or as little as you like'});
if(type==='A07')f=field('What changed?','symptoms',{textarea:true,required:true,full:true,placeholder:'Describe in your own words'})+field('Onset','onset',{required:true,placeholder:'e.g. this morning'})+field('Location / context','site',{required:true})+field('Effect on activities (optional)','impact',{full:true})+select('Would you like to prepare a private review note?','help',['Yes','No']);
if(type==='move')f=field('Activity','activity',{required:true,placeholder:'e.g. planned movement',value:modal.preset?.activity})+field('Duration · minutes','value',{type:'number',required:true,value:modal.preset?.minutes})+field('Equipment or none','equipment',{required:true,value:modal.preset?.equipment})+select('Effort','effort',['Easy','Moderate','Hard','Prefer not to say'])+field('Discomfort (optional)','discomfort',{full:true});
if(type==='meal')f=mealPlate()+select('Meal status','status',['Completed','Partly completed','Not available'])+select('Appetite (optional)','appetite',['Usual','Reduced','Increased','Prefer not to say'],false)+field('Availability or notes (optional)','notes',{full:true});
if(type==='water')f=field('Fluid amount','value',{type:'number',required:true})+select('Original unit','unit',['mL','L','fl oz'])+field('Plan / notes (optional)','notes',{full:true});
if(type==='rest')f=field('Recovery action','activity',{required:true,placeholder:'e.g. quiet break'})+field('Duration · minutes','value',{type:'number',required:true})+field('Notes (optional)','notes',{full:true});
if(type==='A08')return attentionMarkup();
if(!['A05','A06','A07','move','meal','water','rest'].includes(type))f+=select('Reading quality','quality',['Usable','Uncertain','Device reported error']);
return `<div class="field-grid">${f}${field('Observed time','time',{type:'datetime-local',required:true,value:state.day+'T09:00'})}</div>`}
function modalMarkup(){if(modal.type==='schedule-info'){const t=person().tasks.find(x=>x.id===modal.task);if(!t)return '';const label=t.deferred?'Deferred':t.skipped?'Skipped':t.pending?'Awaiting replay':'Scheduled';return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">${esc(label)}</div><h2 id="modal-title">${esc(taskInfo(t).title)}</h2></div><button class="close" data-action="close" aria-label="Close">×</button></div><p>${esc(t.day)} · ${esc(t.time)} UTC</p><p class="subtle">${t.day!==state.day?'This plan item opens on its mission day.':`Status: ${esc(label)}.`}</p><button class="btn btn-light" data-action="close">Back to schedule</button></section></div>`}if(modal.type==='note')return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">PRIVATE FOLLOW-UP</div><h2 id="modal-title">Prepare a review note</h2></div><button class="close" data-action="close" aria-label="Close">×</button></div><div class="notice">Saved locally only. It is not sent to a clinician or mission control. ${modal.record?`Linked record: ${esc(definitions[person().records.find(r=>r.id===modal.record)?.type]?.title||'Observation')}.`:''}</div><form id="note-form"><div class="field-grid">${field('Your note','note',{textarea:true,full:true,required:true})}</div><div class="modal-actions"><button type="button" class="btn btn-white" data-action="close">Cancel</button><button class="btn btn-primary">Save private note</button></div></form></section></div>`;
if(modal.type==='manage'){const t=person().tasks.find(x=>x.id===modal.task);return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><div class="eyebrow">PLAN OPTIONS</div><h2 id="modal-title">${esc(definitions[t.type].title)}</h2><p class="subtle">Changes never complete a task or erase its original score slot.</p></div><button class="close" data-action="close" aria-label="Close">×</button></div><form id="reschedule-form"><div class="field-grid">${field('Time on this mission day','time',{type:'time',required:true,value:t.time})}</div><button class="btn btn-primary">Save new time</button></form><hr><div class="stack"><button class="btn btn-light" data-action="defer">Defer to next day</button>${t.type==='move'?'<button class="btn btn-light" data-action="substitute">Choose a recovery alternative</button>':''}<button class="btn btn-white" data-action="skip">Skip this action</button></div><p class="subtle small" style="margin-top:12px">Skipping or deferring leaves today’s slot unearned. A recovery alternative keeps the same slot. Your records and review notes remain visible.</p></section></div>`}let d=definitions[modal.type],e=entry(modal.type);if(!d)return '';return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div class="modal-title-group">${moduleObject(modal.type==='A01'?'cuff':d.module,'form-object')}<div><div class="eyebrow">${modules[d.module].label} · SYNTHETIC DEMO</div><h2 id="modal-title">${d.title}</h2><p class="subtle">${['A01','A02','A03','A04'].includes(modal.type)?'Enter a synthetic result from an external method. The browser does not measure this.':modal.type==='A08'?'Choose a temporary live activity or a synthetic example.':'A check-in for this simulated persona.'}</p></div></div>${modal.type==='A08'?'':`<span class="modal-companion">${companionArt('listen')}</span>`}<button class="close" data-action="close" aria-label="Close">×</button></div><form id="record-form">${inputs(modal.type)}<details class="notice checkin-about"><summary>About this check-in</summary><p>${e?esc(e.limits):'This record reflects the reported activity, not a medical result.'}</p>${e?sources(e.sourceIds):''}</details><p class="subtle small" style="margin-top:12px">Context saved: ${esc(person().context.phase)} · ${esc(person().context.location)} · ${esc(person().context.gravity)}. Next: review your record or prepare a private note.</p><div id="form-error" class="error" role="alert"></div><div class="modal-actions"><button type="button" class="btn btn-white" data-action="close">Cancel</button>${modal.type==='A08'?(reaction?.origin==='synthetic_fixture'?`<button class="btn btn-primary">Save synthetic example${modal.task?' & complete task':''}</button>`:''):`<button class="btn btn-primary">Save check-in${modal.task?' & complete task':''}</button>`}</div></form></section></div>`}
function pipGreeting(){const next=person().tasks.filter(t=>t.day===state.day&&!t.done&&!t.pending&&!t.skipped&&!t.deferred).sort((a,b)=>a.time.localeCompare(b.time))[0];return next?`Hi, I’m ${esc(companion.displayName)}! Your next action is <b>${esc(taskInfo(next).title)}</b> at ${esc(next.time)} UTC. <button class="btn-link pip-next" data-open="${esc(next.type)}" data-task="${esc(next.id)}">Open it →</button>`:`Hi, I’m ${esc(companion.displayName)}! You’re all caught up. You can explore your health modules or review your plan.`}
function chatMarkup(){return `<section class="chat" aria-label="Mission Assistant"><div class="chat-head"><button data-action="chat" style="float:right;color:white;font-size:20px" aria-label="Close Mission Assistant">×</button><b>${esc(companion.displayName)}</b><small>Your mission companion</small></div><div class="chat-body"><div class="bubble">${pipGreeting()}</div><div class="chat-suggestions" aria-label="Ask Pip">${[['next','What’s next?'],['sleep','Why sleep?'],['reschedule','Change a time'],['medbay','Open MedBay']].map(([id,label])=>`<button type="button" data-chat-prompt="${id}">${label}</button>`).join('')}</div>${chats.map(x=>`<div class="bubble ${x.role==='user'?'user':''}">${x.html}</div>`).join('')}${proposal?`<div class="bubble"><b>Review proposed change</b><br>${esc(definitions[proposal.type].title)}<br>${esc(proposal.from)} → ${esc(proposal.to)} UTC on ${state.day}<br><small>No other fields change. This proposal can become stale.</small><div class="modal-actions"><button class="btn btn-white" data-action="cancel-proposal">Cancel</button><button class="btn btn-primary" data-action="confirm-proposal">Confirm change</button></div></div>`:''}</div><form class="chat-form" id="chat-form"><label class="sr-only" for="chat-input">Message Mission Assistant</label><input id="chat-input" placeholder="Ask about your plan…" required><button class="btn btn-primary">Send</button></form></section>`}
function render(){app.innerHTML=shell();animateRace()}
function focusAfter(selector){const run=()=>{try{document.querySelector(selector)?.focus?.()}catch{}};if(typeof globalThis.queueMicrotask==='function')globalThis.queueMicrotask(run);else Promise.resolve().then(run)}
function closeModal(){if(draftDirty&&!confirm('Discard unsaved changes?'))return;draftDirty=false;stopAttention();modal=null;reaction=null;render();if(focusTarget)focusAfter(focusTarget);focusTarget=null}
function respond(q){const lower=q.toLowerCase();let target=Object.keys(modules).find(k=>lower.includes(k));if(/resched|change time|move.*time/.test(lower)){let t=person().tasks.filter(t=>!t.done&&!t.skipped&&!t.deferred&&t.day===state.day).sort((a,b)=>a.time.localeCompare(b.time))[0];if(!t)return 'Your illustrative plan has no incomplete task to reschedule.';let match=lower.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);if(!match)return 'What time works for you? Try “reschedule to 15:00”.';let to=match[1].padStart(2,'0')+':'+match[2];proposal={id:t.id,type:t.type,revision:t.revision,from:t.time,to};return 'Here is a proposed time change for your next action. Review it before confirming.'}if(/today|agenda|plan|next/.test(lower)){const ts=person().tasks.filter(t=>t.day===state.day);return `Your illustrative plan has ${ts.length} actions; ${ts.filter(t=>t.done).length} completed. Your next action is ${esc(definitions[ts.filter(t=>!t.done&&!t.skipped&&!t.deferred).sort((a,b)=>a.time.localeCompare(b.time))[0]?.type]?.title||'none')}.`}
if(/sleep/.test(lower))return `Sleep reports describe your own experience, not a diagnosis or sleep-stage measurement. NASA studies fatigue and sleep in spaceflight. ${sources(['N05','N18'])}`;
if(/glucose/.test(lower))return `A glucose entry records a value from an external device or laboratory. Blood and interstitial readings are different sources. ${sources(['H02','H03'])}`;
if(target)return `Open <button class="btn-link" data-view="${target}">${modules[target].label} →</button> to find its plan and check-ins.`;
if(/privacy|private/.test(lower))return 'This demonstration stores simulated records locally in this browser. Persona switching is not authentication, and local storage is not a security boundary.';

document.addEventListener('visibilitychange',()=>{document.documentElement?.classList.toggle('page-hidden',document.hidden);if(document.hidden){interruptAttention('Tab hidden');interruptCognitive();interruptTyping()}});
window.addEventListener?.('blur',()=>{interruptAttention('Window lost focus');interruptCognitive();interruptTyping()});
app.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='record-form')saveRecord(formObject(form));if(form.id==='reschedule-form'){const f=formObject(form),t=person().tasks.find(x=>x.id===modal.task);if(t&&transact(()=>applyProposal(state,state.person,{id:t.id,revision:t.revision,from:t.time,to:f.time}))){feedback='Your plan time has been updated.';feedbackKind='message';draftDirty=false;modal=null;render()}}if(form.id==='note-form'){let f=formObject(form);if(transact(()=>{person().notes.push({id:makeId(),text:f.note,recordIds:modal.record?[modal.record]:[],time:state.day+' · demo',status:'open',delivery:'not delivered'})})){feedback='Private note saved on this device.';feedbackKind='message';draftDirty=false;modal=null;render()}}if(form.id==='context-form'){if(transact(()=>{person().context=formObject(form)}))render()}if(form.id==='chat-form'){let v=$('#chat-input').value.trim();if(!v)return;chats.push({role:'user',html:esc(v)});chats.push({role:'assistant',html:respond(v)});render();$('.chat-body').scrollTop=$('.chat-body').scrollHeight;focusAfter('#chat-input')}});
app.addEventListener('change',e=>{if(e.target.id==='persona'){if(modal&&draftDirty&&!confirm('Discard unsaved changes and switch persona?')){e.target.value=state.person;return}draftDirty=false;workoutStop();workout={device:'treadmill',seconds:600,remaining:600,running:false,started:false,end:0,timer:null};recoveryGame=newRecoveryGame();interruptAttention('Persona changed');stopAttention();stopCognitive();cognitive=null;stopTyping();typingSession=null;if(transact(()=>{state.person=e.target.value;if(state.person==='Sam')ensureSamplePersona(state)})){selectedDay=state.day;selectedWeek=missionWeekStart(state.day);signalRange='7d';feedback='';feedbackKind='message';sampleSignals=false;proposal=null;chats=[];modal=null;reaction=null;raceChange=null;previewId=null;dataFilter='all';chosenRacer='player'}render()}});
app.addEventListener('input',e=>{if(e.target.id==='typing-input'&&typingSession?.phase==='measuring'&&e.inputType?.startsWith('delete'))typingSession.corrections++;if(e.target.id==='catalog-search'){query=e.target.value;const pos=e.target.selectionStart;render();const el=$('#catalog-search');el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&modal){const dialog=document.querySelector('.modal');const nodes=dialog?.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]');if(nodes?.length){const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if(e.key==='Escape'&&modal){closeModal()}else if(e.key==='Escape'&&chat){chat=false;render()}});
function updateAmbientClock(){const data=ambientUtc(new Date()),label=document.querySelector('[data-utc-clock]'),scene=document.querySelector('.orbit-intro');if(label)label.textContent=data.time;scene?.setAttribute?.('data-sky',data.phase)}
if(typeof window.setInterval==='function')window.setInterval(updateAmbientClock,60000);

render();

</script></body></html>
